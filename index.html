<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tower Turn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menu">
        <div id="menu-top">
            <div id="record">RECORD: 0</div>
            <div id="menu-stars">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
                <span id="menu-stars-val">0</span>
                <div id="plus-btn">+</div>
            </div>
        </div>

        <div id="perks">
            <div class="perk-card" id="perk-double">
                <div class="perk-title">Double stars</div>
                <div class="perk-status">
                    <svg class="icon-lock" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span class="perk-text">Locked! (RECORD - 20)</span>
                </div>
            </div>
            <div class="perk-card" id="perk-headstart">
                <div class="perk-title">Headstart</div>
                <div class="perk-status">
                    <svg class="icon-lock" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span class="perk-text">Locked! (RECORD - 50)</span>
                </div>
            </div>
        </div>

        <div id="play-btn">
            <svg viewBox="0 0 120 120">
                <path d="M 60 20 L 100 40 L 60 60 L 20 40 Z" fill="#938bac" stroke="#938bac" stroke-width="1"/>
                <path d="M 20 40 L 60 60 L 60 100 L 20 80 Z" fill="#59526b" stroke="#59526b" stroke-width="1"/>
                <path d="M 60 60 L 100 40 L 100 80 L 60 100 Z" fill="#746c8a" stroke="#746c8a" stroke-width="1"/>
                <polygon points="54,46 72,60 54,74" fill="#f0f0f0"/>
            </svg>
        </div>

        <div id="menu-bottom">
            <div class="icon-btn">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
                    <rect x="2" y="6" width="20" height="12" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="12" r="1.5"></circle>
                    <path d="M15.5 10.5v3"></path>
                    <path d="M14 12h3"></path>
                </svg>
            </div>
            <div class="icon-btn" id="sound-btn">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" id="icon-sound-on">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
            </div>
        </div>
    </div>

    <div id="hud">
        <div id="pause-btn">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
                <rect x="6" y="4" width="4" height="16"></rect>
                <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
        </div>
        <div id="score">0</div>
        <div id="run-stars">
            <span id="run-stars-val">0</span>
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
        </div>
    </div>
    
    <div id="turn-btn">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 10 4 15 9 20"></polyline>
            <path d="M20 4v7a4 4 0 0 1-4 4H4"></path>
        </svg>
    </div>

    <div id="total-stars">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <span id="total-stars-val">0</span>
    </div>

    <div id="pause-overlay">PAUSED</div>

    <canvas id="game"></canvas>
    <script src="game.js"></script>
</body>
</html>
